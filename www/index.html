<!DOCTYPE html>
<html lang="de">

<head>
	<title>Zahl des Tages</title>
	<meta name="title" content="Zahl des Tages">
	<meta name="description" content="Generiere die Zahl des Tages!">
	<meta name="keywords" content="Mathe, Unterricht, Zahl des Tages, Zufallsgenerator">
	<meta name="robots" content="index, follow">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="language" content="German">
	<meta name="revisit-after" content="180 days">
	<meta name="author" content="Henning P. Beyer <bubens@unpunk.de>">
	<meta name="viewport" content="width=320, initial-scale=1, user-scaleable=0">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Martian+Mono:wght@100..800&display=swap"
		rel="stylesheet">
	<script src="app.js"></script>
	<style>
		body {
			background: rgba(2, 30, 32, 1);
			color: rgba(220, 226, 228, 1);
		}

		div#temp {
			font-family: 'IMB Plex Sans', 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
			position: absolute;
			font-size: 120pt;
			top: 33%;
			width: 100%;
			text-align: center;
		}
	</style>
</head>

<body>
	<div id="app_goes_here">
		<div id="temp">Loading</div>
	</div>

	<script>
		const loading = (n) => {
			const elem = document.getElementById("temp");

			if (elem !== null) {
				const str = Array(n % 5).join(".")
				elem.innerHtml = "Loading" + str;
				setTimeout(() => loading(n + 1), 20);
			}
			else {
				console.log("Real app running...");
			}
		};
		loading(1);

		const createSample = async function (file) {
			const audioBuffer = await fetch(file)
				.then(response => response.arrayBuffer())
				.then(arrayBuffer => (new window.AudioContext).decodeAudioData(arrayBuffer))
				.catch(error => { console.error(error); throw error; });


			const trigger = (unmuted, callback) => {
				if (!audioBuffer || !unmuted) {
					return false;
				}
				const context = new window.AudioContext;
				const source = context.createBufferSource();
				source.buffer = audioBuffer;
				source.connect(context.destination);
				source.start(0);
				if (callback !== undefined) {
					setTimeout(callback, audioBuffer.duration * 1000);
				}
				return true;
			};

			return { trigger, audioBuffer };
		};

		const cloneObject = obj =>
			(structuredClone)
				? structuredClone(obj)
				: JSON.parse(JSON.stringify(obj));


		const loadStoredDataWithDefault = (storageKey, defaultModel) => {
			let rawData = null;

			try {
				rawData = localStorage.getItem(storageKey);
			}
			catch (e) {
				console.warn("Failed to access local storage. Continue with default values.");
				return cloneObject(defaultModel);
			}

			if (rawData === null) return cloneObject(defaultModel);

			try {
				const parsed = JSON.parse(rawData);
				return (typeof parsed === "object")
					&& parsed !== null
					? parsed
					: cloneObject(defaultModel);

			}
			catch (e) {
				console.error(`Failed to parse stored data for key "${storageKey}":`, e)
				return cloneObject(defaultModel);
			}

		};

		const detectSystemColorScheme = () =>
			window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
				? "darkMode"
				: "lightMode";

		const main = async () => {

			const storageKey = "$ZDT2-data";

			const defaultValues = {
				minimum: "0",
				maximum: "9999",
				workingTime: "180",
				separator: ".",
				currentColorScheme: detectSystemColorScheme(),
				settingsOpen: false
			};

			const click = await createSample("audio/click.mp3");
			const timerDone = await createSample("audio/timer_done.mp3");
			const rollingDone = await createSample("audio/done_rolling.mp3");

			const data = loadStoredDataWithDefault(storageKey, defaultValues);

			data.windowWidth = window.innerWidth;
			data.windowHeight = window.innerHeight;

			const app = Elm.Main.init({
				node: document.querySelector("#app_goes_here"),
				flags: data
			});


			app.ports.triggerAudioEvent.subscribe(event => {
				switch (event) {
					case "click":
						click.trigger(true);
						break;
					case "timerDone":
						timerDone.trigger(true, () => {
							app.ports.audioEventDone.send("timerDone");
						});
						break;
					case "rollingDone":
						rollingDone.trigger(true);
						break;
					default:
						console.warn("Failed to play audioEvent (%s)", event);
				}
			});

			app.ports.toggleFullscreen.subscribe(_ => {
				const element = document.querySelector("body");

				if (document.fullscreenElement === element) {
					document.exitFullscreen()
						.then(() => app.ports.fullscreenChange.send("exit"))
						.catch(err => console.error(err));
				}
				else {
					element.requestFullscreen()
						.then(() => app.ports.fullscreenChange.send("enter"))
						.catch(err => console.error(err));
				}
			});

			app.ports.storeSettings.subscribe(data => {
				const strData = JSON.stringify(data);
				localStorage.setItem(storageKey, strData);
			});

			window.addEventListener("resize", () => {
				const sizes = { width: window.innerWidth, height: window.innerHeight };
				app.ports.windowResized.send(sizes);
			});
		};

		main();
	</script>
</body>

</html>
